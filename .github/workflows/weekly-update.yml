name: Weekly YouTube Studio Ecosystem Update

on:
  schedule:
    # Every Monday at 01:00 UTC (09:00 Asia/Taipei)
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest GitHub releases, stars, and rising projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_radar.py

      - name: Commit updated radar dashboard
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/state.json
          [ ! -f UPDATES.md ] || git add UPDATES.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(radar): weekly ecosystem update ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open release alert issue if upstream frameworks released new versions
        if: hashFiles('data/latest_diff.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('data/latest_diff.md', 'utf8');
            const date = new Date().toISOString().slice(0, 10);
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'release-alert',
                color: 'f2b866',
                description: 'Upstream YouTube video framework release detected'
              });
            } catch (_) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Radar] 上游影片製作框架新版本發布 (${date})`,
              body,
              labels: ['release-alert']
            });
